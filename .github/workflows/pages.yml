name: Demo (GitHub Pages)

# Publica a demo estática de demo/ em
# https://gabrielsoaressn.github.io/school-management-system/
#
# Só o app da demo é publicado: o sistema real precisa de PostgreSQL e sessão,
# e não roda como site estático.

on:
  push:
    branches: [master]
    paths:
      - "demo/**"
      - "src/components/**"
      - "src/app/globals.css"
      - "tailwind.config.ts"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # O postinstall roda `prisma generate`, que não precisa de banco.
      - name: Install dependencies
        run: npm ci

      - name: Build da demo
        run: npm run demo:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
